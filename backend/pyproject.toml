[project]
name = "creativeflow-studio-backend"
version = "0.1.0"
description = "Backend prototype for CreativeFlow Studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.20",
  "Pillow>=10.0.0",
  "requests>=2.31.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
