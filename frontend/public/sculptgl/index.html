  <meta name='apple-mobile-web-app-capable' content='yes'>

  <title> SculptGL - A WebGL sculpting app </title>

  <link rel='stylesheet' type='text/css' href='https://fonts.googleapis.com/css?family=Open+Sans:400,600'>
  <link rel='stylesheet' type='text/css' href='css/yagui.css' />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FPR5XYHC13"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-FPR5XYHC13');
  </script>

  <script>
  'use strict';

  window.sketchfabOAuth2Config = {
    hostname: 'sketchfab.com',
    client_id: 'OWoAmrd1QCS9wB54Ly17rMl2i5AHGvDNfmN4pEUH',

<body oncontextmenu='return false;'>
  <input type='file' id='fileopen' multiple style='display: none' />
  <input type='file' id='backgroundopen' style='display: none' />
  <input type='file' id='alphaopen' style='display: none' />
  <input type='file' id='textureopen' style='display: none' />
  <input type='file' id='matcapopen' style='display: none' />

  <div id='viewport'>
    <canvas id='canvas'></canvas>
  </div>

  <script src='sculptgl.js'></script>
  <!-- <script src='//cdn.webglstats.com/stat.js' defer='defer' async='async'></script> -->
  <script>
    (function () {
      'use strict';
      var app = null;
      var OriginalSculptGL = window.SculptGL;
      window.SculptGL = function () {
        app = new OriginalSculptGL();
        return app;
      };

      function transformPoint(x, y, z, m) {
        return [
          m[0] * x + m[4] * y + m[8] * z + m[12],
          m[1] * x + m[5] * y + m[9] * z + m[13],
          m[2] * x + m[6] * y + m[10] * z + m[14]
        ];
      }

      function exportOBJ() {
        var mesh = app && app.getMeshes && app.getMeshes()[0];
        if (!mesh) return '';
        var v = mesh.getVertices();
        var f = mesh.getFaces();
        var nv = mesh.getNbVertices();
        var nf = mesh.getNbFaces();
        var m = mesh.getMatrix ? mesh.getMatrix() : null;
        var out = 's 0\no mesh_0\n';
        for (var i = 0; i < nv; i++) {
          var p = m ? transformPoint(v[i * 3], v[i * 3 + 1], v[i * 3 + 2], m) : [v[i * 3], v[i * 3 + 1], v[i * 3 + 2]];
          out += 'v ' + p[0].toFixed(6) + ' ' + p[1].toFixed(6) + ' ' + p[2].toFixed(6) + '\n';
        }
        for (var j = 0; j < nf; j++) {
          out += 'f ' + (f[j * 3] + 1) + ' ' + (f[j * 3 + 1] + 1) + ' ' + (f[j * 3 + 2] + 1) + '\n';
        }
        return out;
      }

      function post(message) {
        if (window.parent && window.parent !== window) window.parent.postMessage(message, '*');
      }

      window.addEventListener('message', function (event) {
        var data = event.data || {};
        if (data.type === 'flowstudio-sculptgl-load') {
          if (app && typeof app.loadScene === 'function') {
            try { app.loadScene(data.obj, 'obj'); } catch (error) { post({ type: 'flowstudio-sculptgl-error', message: String(error) }); }
          }
        } else if (data.type === 'flowstudio-sculptgl-export') {
          try { post({ type: 'flowstudio-sculptgl-export-result', obj: exportOBJ() }); }
          catch (error) { post({ type: 'flowstudio-sculptgl-error', message: String(error) }); }
        }
      }, false);

      window.addEventListener('load', function () {
        setTimeout(function () { post({ type: 'flowstudio-sculptgl-ready' }); }, 800);
      });
    })();
  </script>
</body>

</html>
